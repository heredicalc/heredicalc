# Trait code mappings for all CI5 editions → HBOPC canonical phenotype names.
# Pedigree affection code mappings → canonical phenotype names.
#
# CI5 trait codes are 3-digit zero-padded strings (uniform across all editions).

trait_mappings:
  # CI5-IX / CI5-X breast (C50)
  "113": "BreastCancer"
  # CI5-IX / CI5-X ovary (C56)
  "133": "OvarianCancer"
  # CI5-IX / CI5-X pancreas (C25)
  "070": "PancreaticCancer"

  # CI5-XI breast (C50)
  "111": "BreastCancer"
  # CI5-XI ovary (C56)
  "130": "OvarianCancer"
  # CI5-XI pancreas (C25)
  "065": "PancreaticCancer"

  # CI5-XII breast (C50)
  "159": "BreastCancer"
  # CI5-XII ovary (C56)
  "178": "OvarianCancer"
  # CI5-XII pancreas (C25)
  "080": "PancreaticCancer"

  # CI5-VIII breast (C50)
  "116": "BreastCancer"
  # CI5-VIII ovary (C56)
  "136": "OvarianCancer"
  # CI5-VIII pancreas (C25)
  "071": "PancreaticCancer"

affection_mappings:
  "BrCa":  "BreastCancer"
  "OvCa":  "OvarianCancer"
  "PanCa": "PancreaticCancer"
  "unaff": null
  ".":     null
