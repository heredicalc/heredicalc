[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heredicalc"
version = "4.1.0"
description = "Full Likelihood Bayes factor computation for hereditary cosegregation analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HerediCalc Contributors" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.5",
    "packaging>=24.0",
    "platformdirs>=4.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.7",
    "SQLAlchemy>=2.0",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
    "nbformat>=5.9",
]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "heredicalc[docs]",
]

[project.scripts]
heredicalc = "heredicalc.apps.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/heredicalc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/heredicalc"]
omit = ["*/apps/gui/*", "*/apps/web/*"]

[tool.coverage.report]
fail_under = 80
