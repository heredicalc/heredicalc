[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "heredicalc"
dynamic = ["version"]
description = "Full Likelihood Bayes factor computation for hereditary cosegregation analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HerediCalc Contributors" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = ["genetics", "cosegregation", "FLB", "pathogenicity", "Bayesian", "pedigree"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.5",
    "packaging>=24.0",
    "platformdirs>=4.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.7",
    "SQLAlchemy>=2.0",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
    "nbformat>=5.9",
]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "heredicalc[docs]",
]

[project.urls]
Homepage = "https://github.com/heredicalc/heredicalc"
Documentation = "https://heredicalc.github.io/heredicalc"
Repository = "https://github.com/heredicalc/heredicalc"
Changelog = "https://github.com/heredicalc/heredicalc/blob/main/CHANGELOG.md"

[project.scripts]
heredicalc = "heredicalc.apps.cli.main:app"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/heredicalc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/heredicalc"]
omit = ["*/apps/gui/*", "*/apps/web/*"]

[tool.coverage.report]
fail_under = 80
