name: Release

on:
  push:
    tags:
      - "v*"

# Testing is handled by ci.yml (fast lane on every push/PR; full FLB validation on
# v* tags and via workflow_dispatch). This workflow only builds and publishes from
# the canonical repository itself, using the automatic GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build hatch-vcs
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'EOF'
          import re
          text = open("CHANGELOG.md").read()
          tag = "${{ github.ref_name }}".lstrip("v")
          pattern = rf"(## \[{re.escape(tag)}\].*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          open("release-notes.md", "w").write(m.group(1).strip() if m else f"Release {tag}")
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            dist/*

  docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Default persist-credentials: true configures the GITHUB_TOKEN for `origin`,
      # which `mkdocs gh-deploy` uses to push the built site to the gh-pages branch.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Deploy docs to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
