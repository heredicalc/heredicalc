name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            kinship2
            segregatr

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build hatch-vcs
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-public:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to public repo
        run: |
          git remote add public https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/heredicalc/heredicalc.git
          git push public HEAD:main --force
          git push public ${{ github.ref }} --force

  release:
    needs: publish-public
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'EOF'
          import re, sys
          text = open("CHANGELOG.md").read()
          tag = "${{ github.ref_name }}".lstrip("v")
          pattern = rf"(## \[{re.escape(tag)}\].*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          open("release-notes.md", "w").write(m.group(1).strip() if m else f"Release {tag}")
          EOF

      - name: Create GitHub Release on public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release delete ${{ github.ref_name }} --repo heredicalc/heredicalc --yes 2>/dev/null || true
          gh release create ${{ github.ref_name }} \
            --repo heredicalc/heredicalc \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  docs:
    needs: publish-public
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Deploy docs to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add public https://x-access-token:${GH_TOKEN}@github.com/heredicalc/heredicalc.git
          mkdocs gh-deploy --remote-name public --force
